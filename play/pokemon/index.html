  /* 카드 주변만 살짝 밝혀 글자를 띄운다. 스프라이트는 가장자리에서 선명하게 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(52% 58% at 50% 50%, rgba(255,255,255,.5), rgba(255,255,255,0) 72%);
  }
  .stage { width: 100%; max-width: 520px; }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .38s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  /* ---- 카트리지 카드 공통: 잉크 보더 + 하드 오프셋 섀도 ---- */
  .hero, .qcard, .result {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 20px;
    box-shadow: 8px 8px 0 var(--ink);
  }

  /* ---- 시작 화면 ---- */
  .hero { padding: 40px 28px 30px; text-align: center; }
  .ball { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%;
    background: linear-gradient(var(--red) 0 47%, var(--ink) 47% 53%, #F3F3F3 53% 100%);
    border: 4px solid var(--ink); position: relative;
    animation: wobble 3.2s ease-in-out infinite; }
  .ball::after { content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 5px solid var(--ink); left: 50%; top: 50%; transform: translate(-50%,-50%); }
  @keyframes wobble { 0%, 100% { rotate: 0deg; } 30% { rotate: -8deg; } 60% { rotate: 8deg; } }
  h1 { font-size: 30px; font-weight: 900; margin: 6px 0 6px; letter-spacing: -0.8px; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 24px; line-height: 1.65; }
  .nick { width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px;
    font-size: 16px; text-align: center; margin-bottom: 12px; outline: none;
    background: #FAFBFC; transition: border-color .2s, background .2s; }
  .nick:focus { border-color: var(--ink); background: #fff; }
  .btn {
    width: 100%; padding: 16px; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 999px;
    font-size: 17px; font-weight: 800; color: var(--ink); font-family: inherit;
    background: var(--yellow); box-shadow: 0 4px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:focus-visible, .nick:focus-visible, .dot:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .meta { margin-top: 16px; font-size: 12px; color: #9AA2B1; }

  /* ---- 퀴즈 화면 ---- */
  .qtop { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
  .qtop span { background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; }
  .qtop span:empty { display: none; }
  .progress { height: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
  .bar { height: 100%; width: 0; background: var(--red); border-radius: 99px; transition: width .35s ease; }
  .qcard { padding: 34px 26px 28px; }
  .qnum { color: var(--red); font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  .qtext { font-size: 19.5px; font-weight: 700; line-height: 1.55; margin: 12px 0 28px; min-height: 120px; letter-spacing: -0.3px; }
  .scale { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dot { border-radius: 50%; border: 3px solid; background: var(--paper); cursor: pointer; flex: 0 0 auto; padding: 0;
    transition: transform .12s, background .12s; }
  .dot:hover { transform: scale(1.12); }
  .dot:active { transform: scale(.86); }
  .dot.agree { border-color: var(--agree); }
  .dot.agree:hover { background: rgba(63,169,104,.18); }
  .dot.disagree { border-color: var(--disagree); }
  .dot.disagree:hover { background: rgba(232,90,90,.18); }
  .dot.neutral { border-color: #C2C8D2; }
  .dot.neutral:hover { background: rgba(194,200,210,.22); }
  .scale-labels { display: flex; justify-content: space-between; margin-top: 14px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .back { margin-top: 22px; text-align: center; }
  .back button { background: none; border: none; color: #9AA2B1; font-size: 13px; cursor: pointer; font-family: inherit; }
  .back button:hover { color: var(--ink); }

  /* ---- 결과 화면 ---- */
  .result { overflow: hidden; }
  .rtop { padding: 26px 24px 16px; text-align: center; color: #fff; position: relative; border-bottom: 3px solid var(--ink); }
  .rlabel { font-size: 13px; font-weight: 700; opacity: .92; }
  .rimg { width: 220px; height: 220px; object-fit: contain; margin: 4px auto -6px;
    filter: drop-shadow(0 12px 16px rgba(0,0,0,.3)); display: block; }
  .rbody { background: var(--paper); padding: 22px 24px 26px; text-align: center; }
  .rno { color: #9AA2B1; font-weight: 700; font-size: 13px; }
  .rname { font-size: 30px; font-weight: 900; margin: 2px 0 12px; letter-spacing: -0.5px; }
  .chips { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .chip { color: #fff; font-weight: 700; font-size: 13px; padding: 6px 16px; border-radius: 999px; border: 2px solid var(--ink); }
  .rdesc { background: #F4F6FB; border: 2px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 14.5px; line-height: 1.7; color: #3A4251; text-align: left; margin-bottom: 14px; }
  .rdex { font-size: 13.5px; line-height: 1.65; color: var(--muted); text-align: left; margin-bottom: 20px; }
  .rdex b { color: #3A4251; }
  .traits { font-size: 12.5px; color: #9AA2B1; margin-bottom: 18px; }
  .btn.ghost { background: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .ball { animation: none; }
    .bar, .btn, .dot { transition: none; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- 시작 -->
  <section id="start" class="screen active">
    <div class="hero">
      <div class="ball"></div>
      <h1>내가 포켓몬이라면?</h1>
      <p class="sub">16가지 상황, 당신이라면 어떻게 할까요?<br/>선택을 따라가면 꼭 닮은 포켓몬이 나옵니다. (약 3~5분)</p>
      <input id="nick" class="nick" maxlength="12" placeholder="닉네임 (선택)" />
      <button class="btn" id="startBtn">시작하기</button>
      <p class="meta">데이터: PokéAPI · 1세대 151마리</p>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="quiz" class="screen">
    <div class="qtop"><span id="counter">1 / 16</span><span id="who"></span></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="qcard">
      <div class="qnum" id="qnum">Q1</div>
      <div class="qtext" id="qtext"></div>
      <div class="scale" id="scale"></div>
      <div class="scale-labels"><span>아니다</span><span>맞다</span></div>
      <div class="back"><button id="backBtn">← 이전 질문</button></div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen">
    <div class="result">
      <div class="rtop" id="rtop">
        <div class="rlabel" id="rlabel">당신이 포켓몬이라면…</div>
        <img class="rimg" id="rimg" alt="" />
      </div>

  bug:     { ko: "벌레",   color: "#A6B91A", trait: "성실하고 꾸준하게 자기 몫을 해내는 노력가" },
  rock:    { ko: "바위",   color: "#B6A136", trait: "한결같고 듬직해 주변이 믿고 기대는 사람" },
  ghost:   { ko: "고스트", color: "#735797", trait: "장난기 넘치고 개성 강한 미스터리한 매력의 소유자" },
  dragon:  { ko: "드래곤", color: "#6F35FC", trait: "자존심과 카리스마로 사람을 이끄는 리더형" },
  dark:    { ko: "악",     color: "#705746", trait: "쿨하고 자기 주관이 뚜렷한 사람" },
  steel:   { ko: "강철",   color: "#B7B7CE", trait: "단단하고 책임감이 강한 사람" },
  fairy:   { ko: "페어리", color: "#D685AD", trait: "사랑스럽고 다정한 분위기의 사람" },
};

/* ===== 질문 16개 — load: 타입 slug -> 가중치 (응답 -3..+3과 곱해 누적) ===== */
const QUESTIONS = [
  { t: "친구가 \"이건 절대 못 깬다\"는 게임을 보여줬다. 웃어넘기기보다, 그날 밤 공략을 찾아서라도 도전해본다.", load: { fire: 1 } },
  { t: "금요일 밤, 시끌벅적한 파티 초대와 이불 속 넷플릭스. 고민할 것도 없이 이불이다.",             load: { grass: 1, fire: -0.5 } },
  { t: "여행 중 비가 와서 일정이 전부 비었다. 무너진 계획을 아쉬워하기보다, 동네를 걷다 눈에 들어오는 곳으로 향하며 새 하루를 만든다.", load: { water: 1 } },
  { t: "일요일 아침에 열리는 러닝 행사에 초대받았다. 이불 속에서 고민하기보다, 미리 신청해두고 아침부터 몸을 움직인다.", load: { electric: 1 } },
  { t: "안 풀리는 문제가 하나 생기면 밥 먹다가도 생각난다. 끝을 봐야 잠이 온다.",                   load: { fighting: 1 } },
  { t: "친구가 \"나 요즘 괜찮아\"라고 했지만, 표정만 보고 뭔가 있다는 걸 바로 눈치챈다.",            load: { psychic: 1 } },
  { t: "\"지금만 즐길 수 있는 제철 여행지\" 목록을 봤다. 저장만 해두기보다, 바로 빈 주말을 찾아 떠날 계획을 짠다.", load: { flying: 1 } },
  { t: "단톡방이 며칠째 조용하다. 눈치를 보며 가만히 있기보다, 뜬금없는 밈 하나를 던져 분위기를 뒤집는다.", load: { ghost: 1 } },
  { t: "습관 코치 앱으로 30일 도전을 시작했다. 며칠 하다 흐지부지되기보다, 알림이 없어도 혼자 기록하며 끝까지 간다.", load: { bug: 1 } },
  { t: "발표 직전, 팀 파일이 안 열린다. 같이 패닉에 빠지기보다, \"일단 정리부터 하자\"며 침착하게 대안을 찾는다.", load: { ice: 1 } },
  { t: "친구들이 고민이 생기면 제일 먼저 나를 찾는다. \"너한테 말하면 마음이 놓여.\"",              load: { rock: 1, ground: 0.5 } },
  { t: "보드게임에서 내 차례가 왔다. 손에 잡히는 대로 두기보다, 세 수 앞을 계산하며 이기는 그림을 그린다.", load: { poison: 1 } },
  { t: "처음 가는 모임에서도 튀지 않고 스르륵 스며든다. \"쟤는 어딜 가나 잘 어울려\"라는 말을 듣는다.", load: { normal: 1 } },
  { t: "다섯 명이 저녁 약속을 잡는데 결론이 안 난다. 흘러가는 대로 두기보다, 내가 날짜와 메뉴를 정리해 결정을 이끈다.", load: { dragon: 1 } },
  { t: "우는 친구 앞에서는 해결책보다 어깨를 먼저 내어준다. 위로는 내 특기다.",                     load: { grass: 0.7, water: 0.7 } },
  { t: "친구들과 사다리 타기 벌칙 게임에서 졌다. \"재미로 하는 거지\" 하고 넘기기보다, 은근히 분해서 한 판 더 하자고 한다.", load: { fighting: 0.8, fire: 0.5 } },
];

const SCALE_VALUES = [-3, -2, -1, 0, 1, 2, 3];
const SCALE_SIZES  = [44, 36, 28, 24, 28, 36, 44];

/* ===== 상태 ===== */
let idx = 0;
const answers = new Array(QUESTIONS.length).fill(null);
let nick = "";

const $ = (id) => document.getElementById(id);

/* ===== 시작 ===== */
(function init() {
  const saved = localStorage.getItem("pkq_nick");
  if (saved) $("nick").value = saved;
  $("startBtn").addEventListener("click", start);
  $("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });
  $("backBtn").addEventListener("click", goBack);
  $("againBtn").addEventListener("click", reset);
})();

function start() {
  nick = $("nick").value.trim();
  if (nick) localStorage.setItem("pkq_nick", nick); else localStorage.removeItem("pkq_nick");
  $("who").textContent = nick ? nick + " 님" : "";
  idx = 0;
  show("quiz");
  renderQuestion();
}

function show(name) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $(name).classList.add("active");
  window.scrollTo(0, 0);
}

/* ===== 질문 렌더 ===== */
function renderQuestion() {
  const q = QUESTIONS[idx];
  $("counter").textContent = (idx + 1) + " / " + QUESTIONS.length;
  $("qnum").textContent = "Q" + (idx + 1);
  $("qtext").textContent = q.t;
  $("bar").style.width = (idx / QUESTIONS.length) * 100 + "%";
  $("backBtn").style.visibility = idx === 0 ? "hidden" : "visible";

  const scale = $("scale");
  scale.innerHTML = "";
  SCALE_VALUES.forEach((v, i) => {
    const b = document.createElement("button");
    const cls = v > 0 ? "agree" : v < 0 ? "disagree" : "neutral";
    b.className = "dot " + cls;
    b.style.width = b.style.height = SCALE_SIZES[i] + "px";
    if (answers[idx] === v) b.style.background = v > 0 ? "var(--agree)" : v < 0 ? "var(--disagree)" : "#c2c8d2";
    b.addEventListener("click", () => answer(v));
    scale.appendChild(b);
  });
}

function answer(v) {
  answers[idx] = v;
  if (idx < QUESTIONS.length - 1) {
    idx++;
    renderQuestion();
  } else {
    $("bar").style.width = "100%";
    finish();
  }
}

function goBack() {
  if (idx > 0) { idx--; renderQuestion(); }
}

/* ===== 매칭 로직 ===== */
function computeTypeScores() {
  const raw = {}, denom = {};
  QUESTIONS.forEach((q, i) => {
    const v = answers[i] == null ? 0 : answers[i];
    for (const [type, w] of Object.entries(q.load)) {
      raw[type] = (raw[type] || 0) + v * w;
      denom[type] = (denom[type] || 0) + Math.abs(w) * 3; // 최대 가능 점수
    }
  });
  const norm = {};
  for (const type in raw) norm[type] = raw[type] / (denom[type] || 1); // 대략 -1..1
  return norm;
}

function pickResult() {
  const scores = computeTypeScores();
  // 점수 높은 순 타입 정렬
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  // 1등 타입 중 후보가 있는 첫 타입 선택
  let topType = null, candidates = [];
  for (const [type] of ranked) {
    const pool = POKEDEX.filter((p) => p.types.some((t) => t.slug === type));
    if (pool.length) { topType = type; candidates = pool; break; }
  }
  if (!topType) { topType = "normal"; candidates = POKEDEX.slice(); }

  // 2차: 전체 응답 강도(에너지)로 후보 중 종족값 수준 매칭
  const energy = answers.reduce((s, v) => s + ((v == null ? 0 : v) + 3) / 6, 0) / answers.length; // 0..1
  candidates.sort((a, b) => bst(a) - bst(b));
  const pickIdx = Math.round(energy * (candidates.length - 1));
  const mon = candidates[Math.max(0, Math.min(candidates.length - 1, pickIdx))];

  const second = ranked.find(([t]) => t !== topType && scores[t] > 0.05);
  return { mon, topType, secondType: second ? second[0] : null, ranked };
}

function bst(p) {
  return Object.values(p.stats).reduce((s, v) => s + v, 0);
}

/* ===== 결과 렌더 ===== */
function finish() {
  if (!POKEDEX.length) { alert("포켓몬 데이터가 비어 있습니다. harvest.py를 실행해 주세요."); return; }
  const { mon, topType, secondType, ranked } = pickResult();
  const ti = TYPE[topType] || TYPE.normal;

  $("rtop").style.background = "linear-gradient(160deg, " + ti.color + ", " + shade(ti.color, -28) + ")";
  $("rlabel").textContent = (nick ? nick + " 님이" : "당신이") + " 포켓몬이라면…";
  const img = $("rimg");
  img.src = mon.img;
  img.alt = mon.name;
  img.onerror = () => { img.onerror = null;
    img.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" + mon.id + ".png"; };

  $("rno").textContent = "No. " + String(mon.id).padStart(3, "0");
  $("rname").textContent = mon.name;

  const chips = $("chips");
  chips.innerHTML = "";
  mon.types.forEach((t) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.style.background = (TYPE[t.slug] || {}).color || "#888";
    c.textContent = t.ko;
    chips.appendChild(c);
  });

  let desc = "당신은 " + ti.trait + (hasBatchim(ti.trait) ? "이에요." : "예요.");
  if (secondType && TYPE[secondType]) desc += " 동시에 " + TYPE[secondType].trait + "의 면모도 지녔죠.";
  desc += " 그래서 " + mon.name + (hasBatchim(mon.name) ? "과" : "와") + " 꼭 닮았어요!";
  $("rdesc").textContent = desc;

  $("rdex").innerHTML = mon.flavor
    ? "<b>도감 설명</b><br/>" + escapeHtml(mon.flavor)
    : "";

  const topThree = ranked.slice(0, 3).map(([t]) => (TYPE[t] || {}).ko || t).join(" · ");
  $("traits").textContent = "주요 성향: " + topThree;

  try { localStorage.setItem("pkq_last", JSON.stringify({ id: mon.id, name: mon.name, type: topType })); } catch (e) {}
  show("result");
}

function reset() {
  answers.fill(null);
  idx = 0;
  show("start");
}

/* ===== 유틸 ===== */
function hasBatchim(s) {
  const c = s.charCodeAt(s.length - 1);
  return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
</script>
